name: Update profile card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main, profile-card]
    paths:
      - ascii.txt
      - scripts/today.py
      - .github/workflows/profile-card.yml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render dark_mode.svg and light_mode.svg
        run: python scripts/today.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile card"
          git pull --rebase
          git push
